name: Keep Supabase awake

# Supabase free projects pause after about 7 days without activity.
# This pings the REST API every 3 days so the trip data stays reachable.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          URL="https://ksaluzkbeejrlmihqksq.supabase.co"
          KEY="sb_publishable_Y2qt8hqdTsuYsehuOqe7sQ_3lyXcNlA"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/trips?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "rest status: $code"
          case "$code" in 200|401|403) exit 0;; *) exit 1;; esac
